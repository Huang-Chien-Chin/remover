<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>圖片去背</title>
  <style>
    body { font-family: Arial,"Noto Sans TC",sans-serif; margin:24px; }
    h1 { margin-bottom:10px; }
    .warning { color:red; font-weight:bold; margin-bottom:15px; }
    .controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    /* 統一按鈕樣式 */
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      height:38px; padding:8px 16px; font-size:14px;
      border:1px solid #ccc; border-radius:6px; background:#f7f7f7;
      color:#000; cursor:pointer; white-space:nowrap; text-decoration:none;
    }
    .btn:hover{ background:#e9e9e9; }
    /* 檔案選擇器的按鈕也統一 */
    input[type="file"]{ font-size:14px; font-family:Arial,"Noto Sans TC",sans-serif; }
    input[type="file"]::file-selector-button{
      padding:8px 16px; font-size:14px; border:1px solid #ccc; border-radius:6px;
      background:#f7f7f7; cursor:pointer; margin-right:8px; height:38px;
    }
    input[type="file"]::file-selector-button:hover{ background:#e9e9e9; }
  </style>
</head>
<body>
  <h1>圖片去背</h1>
  <p class="warning">⚠ 僅支援 JPG、PNG、WEBP、JFIF、BMP</p>

  <!-- 直接打到 /remove-bg；用 JS 攔截後 fetch，不跳頁 -->
  <form id="removeForm" action="/remove-bg" method="post" enctype="multipart/form-data">
    <div class="controls">
      <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.jfif,.bmp" required>
      <button type="submit" class="btn">去背</button>
      <button type="button" class="btn" onclick="location.href='/gallery'">相簿</button>
    </div>
  </form>

  <script>
  document.getElementById('removeForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fileInput = this.querySelector('input[name="image"]');
    if (!fileInput.files.length) { alert('請先選擇圖片'); return; }

    const fd = new FormData(this);
    try {
      const res = await fetch(this.action, { method: 'POST', body: fd });
      if (!res.ok) throw new Error('處理失敗');
      const data = await res.json(); // { filename, url }

      // 下載：抓檔案 blob 後觸發下載，不污染其他連結
      const imgRes = await fetch(data.url + `?t=${Date.now()}`);
      const blob = await imgRes.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = data.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    } catch (err) {
      alert(err.message || '去背時發生錯誤');
    }
  });
  </script>
</body>
</html>
